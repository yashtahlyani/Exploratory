name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # headless OpenCV avoids needing system GUI libraries in CI
          pip install opencv-contrib-python-headless numpy pandas openpyxl \
                      Pillow matplotlib scikit-learn pytest ruff

      - name: Lint (ruff)
        run: ruff check .
        continue-on-error: true        # style nits never block the build

      - name: Run tests
        run: pytest
